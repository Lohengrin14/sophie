services:
  db:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:54329:5432'
    environment:
      POSTGRES_USER: sophie
      POSTGRES_PASSWORD: sophie_local_only
      POSTGRES_DB: sophie
    volumes:
      - sophie_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sophie -d sophie']
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  sophie_postgres:
